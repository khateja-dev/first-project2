<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    /* --- Global Styles --- */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      /* color: #333; */
      line-height: 1.6;
    }

    a {
      color: #0066cc;
      text-decoration: none;
      margin: 0 10px;
    }

    a:hover {
      text-decoration: underline;
    }

    /* --- Header --- */
    header {
      background-color: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between; /* Push title left, nav right */
      align-items: center; /* Vertically center both */
      padding: 15px 40px;
      flex-wrap: wrap; /* Allow wrapping on small screens */
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
    }

    nav a {
      color: white;
      font-weight: bold;
      margin-left: 20px;
    }

    /* --- Layout --- */
    main {
      width: 70%;
      float: left;
      padding: 20px;
      box-sizing: border-box;
    }

    aside {
      width: 30%;
      float: right;
      background-color: #ecf0f1;
      padding: 20px;
      box-sizing: border-box;
      border-left: 2px solid #ccc;
    }

    article {
      background-color: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    article header h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    article footer {
      font-size: 0.9em;
      color: #666;
      border-top: 1px solid #ddd;
      margin-top: 10px;
      padding-top: 5px;
    }

    /* --- Footer --- */
    footer {
      clear: both;
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
    }

    /* --- Responsive Design --- */
    @media (max-width: 768px) {
      main, aside {
        width: 100%;
        float: none;
      }

      header {
        flex-direction: column; /* Stack title and nav */
        align-items: center;
      }

      nav a {
        display: inline-block;
        margin: 5px 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <article>
      <header>
        <h2>Welcome!</h2>
      </header>
      <p>This is my first post. I'm learning HTML!</p>
      <footer>
        <p>Posted by Jane on October 27, 2025</p>
      </footer>
    </article>
  </main>

  <aside>
    <h3>About Me</h3>
    <p>I'm Jane, a beginner web developer sharing my learning journey.</p>
  </aside>

  <footer>
    <p>&copy; 2025 My Website</p>
  </footer>
</body>
</html>
